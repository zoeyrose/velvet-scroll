name: CodeQL

on:
  push:
    branches: [main, '*.x']
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust for CodeQL extraction
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Rust supports extraction without a full build, as do the other
          # languages analyzed here. Rust extraction still uses Cargo/rustup.
          build-mode: none
          queries: security-extended
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  validation:
    name: CodeQL validation
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every language analysis to succeed
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "$ANALYSIS_RESULT" != 'success' ]; then
            echo 'One or more CodeQL analyses did not succeed.' >&2
            exit 1
          fi
