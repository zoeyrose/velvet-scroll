name: Website deploy

on:
  workflow_run:
    workflows: ['Website checks']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: website-deploy-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    steps:
      # Privileged code always comes from main, never the PR or its artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authorize current source and preview actors
        id: authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site-ci/authorize.mjs
      - name: Install pinned deployment tool from trusted main
        if: steps.authorization.outputs.authorized == 'true'
        run: npm ci --prefix site-ci --ignore-scripts --no-audit --no-fund
      - name: Download exact checked artifact and validate static files
        if: steps.authorization.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node site-ci/download.mjs "$RUNNER_TEMP/website.zip"
          python3 site-ci/extract.py "$RUNNER_TEMP/website.zip" "$RUNNER_TEMP/website-static"
      - name: Publish authorized static website
        if: steps.authorization.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node site-ci/deploy.mjs "$RUNNER_TEMP/website-static"
